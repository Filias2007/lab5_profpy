[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable_importer"
version = "0.1.0"
description = "Лабораторна робота №5: Обробка помилок, файли та серіалізація (Варіант 3)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]